<style>/* 閲覧専用の公開版。ホームページのデザインに合わせて差し替えられるよう、色・書体は :root の変数だけで決める。
   いまは「どのデザインにも馴染む」中立の配色（白・墨色・青）。 */
:root{
  /* デザインシステム「三浦A邸 大漁旗」の色（2026-11-14） */
  --ink:#14202B; --ink-2:#4F6070; --accent:#0A5A8C; --soft:#F2F6F9; --soft-2:#E6F0F6;
  --line:#D9E1E8; --bg:#FFFFFF; --card:#FFFFFF; --kon:#2E4C9E; --tuna:#B8243A;
  --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --r:14px; --sea:#0A5A8C; --mute:#4F6070; --hair:#D9E1E8; --tint:#F2F6F9;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.75 var(--font);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 40px}
body.embed .hero{display:none}
body.embed .wrap{padding-top:8px}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;color:inherit}

.hero{padding:0 0 4px}
.eyebrow{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--accent)}
h1{margin:4px 0 0;font-family:var(--mincho);font-size:clamp(26px,6.5vw,34px);line-height:1.3;font-weight:800;letter-spacing:.02em}
.hd{display:block;width:100%;height:auto;border-radius:10px;margin:0 0 12px}
.eyebrow{display:flex;align-items:center;gap:8px}.eyebrow img{width:40px;height:40px}
.two{width:120px;height:9px;margin:14px 0 0;background:linear-gradient(var(--accent),var(--accent)) 0 0/100% 3px no-repeat,linear-gradient(var(--tuna),var(--tuna)) 0 6px/60% 3px no-repeat}
h1 span{display:inline-block}
.lede{margin:10px 0 0;font-size:15px;line-height:1.8;color:var(--ink-2);max-width:34em}
.draft{margin:16px 0 0;padding:10px 14px;background:#FFF8E1;border:1px solid #EBD38A;border-radius:10px;font-size:13.5px;line-height:1.6}

.filters{margin-top:20px;display:grid;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 16px;border:1px solid var(--line);border-radius:99px;background:#fff;font-weight:700;font-size:14.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.chips.sc .chip{min-height:36px;font-size:13.5px;padding:0 13px}

.mapcard{margin-top:16px;border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
#map{height:clamp(320px,56vh,540px);background:#ecedee}
.mapfoot{border-top:1px solid var(--line);padding:10px 16px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.leaflet-tile-pane{filter:grayscale(.35) brightness(1.04) contrast(.95)}
.leaflet-bar{border:1px solid var(--line)!important;border-radius:10px!important;overflow:hidden;box-shadow:none!important}
.leaflet-bar a{color:var(--ink)!important}
.pin{width:30px;height:30px;border-radius:50%;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
.leaflet-popup-content{font:500 14px/1.6 var(--font);margin:12px 14px;color:var(--ink)}
.leaflet-control-attribution{font-size:10px}

h2{display:flex;align-items:baseline;gap:10px;margin:32px 0 14px;font-family:var(--mincho);font-weight:800;font-size:20px;line-height:1.35;font-weight:700}
h2 small{font-size:13px;font-weight:500;color:var(--ink-2)}
.item{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:0 0 12px;cursor:pointer}
/* 番号は写真の左上に重ねる（左の余白をなくし、写真と店名を囲いいっぱいに。2026-11-14 ヤヌキ指示） */
.item .n{position:absolute;top:20px;left:20px;z-index:1;width:34px;height:34px;border-radius:50%;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.item>div:not(.n){padding:0 2px}
.item h3{margin:0;font-size:17.5px;line-height:1.4;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;font-weight:700;color:var(--ink-2);background:var(--soft);border-radius:99px;padding:0 10px;line-height:22px}
.tag.chk{color:#7a5a00;background:#FFF3C4}
.hearts{margin:8px 0 0;font-size:17px;letter-spacing:1px;line-height:1.2}
.quote{margin:10px 0 0;padding:9px 12px;background:var(--soft);border-left:3px solid var(--accent);border-radius:4px 10px 10px 4px;font-size:14.5px;line-height:1.7}
.quote b{display:block;font-size:11.5px;letter-spacing:.08em;color:var(--accent);margin-bottom:2px}
.note{margin:10px 0 0;font-size:14.5px;line-height:1.75}
.meta{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--ink-2)}
.meta a{margin-left:6px}
.ph{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;margin:0 0 8px;background:var(--soft-2)}
.noph{display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.1em}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.acts a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--soft-2);color:var(--accent);font-weight:700;font-size:14px;text-decoration:none}
.item .ost{margin:4px 0 0}

.ost{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;line-height:1.4}
.ost::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.ost[data-s="open"]{color:var(--sea)}
.ost[data-s="soon"],.ost[data-s="closed"],.ost[data-s="unknown"]{color:var(--mute);font-weight:400}
.ost[data-s="off"]{color:var(--mute);font-weight:400}
.ost[data-s="off"]::before,.ost[data-s="closed"]::before,.ost[data-s="unknown"]::before{background:none;border:1.5px solid currentColor;width:6px;height:6px}

.empty{padding:28px 16px;text-align:center;color:var(--ink-2);background:var(--soft);border-radius:var(--r)}
.foot{margin-top:24px;font-size:12.5px;color:var(--ink-2);line-height:1.7}
.lang{float:right;display:inline-grid;grid-template-columns:1fr 1fr;gap:2px;padding:3px;margin:0 0 10px 8px;background:var(--tint);border:1px solid var(--hair);border-radius:999px}
.lang a{display:flex;align-items:center;justify-content:center;min-width:52px;min-height:38px;border-radius:999px;color:var(--mute);font:400 14px/1 var(--font);letter-spacing:.04em;text-decoration:none}
.lang a[aria-current="page"]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--hair)}
.hero .hd{clear:both}
body.embed .lang{display:none}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media (min-width:720px){.wrap{padding-top:40px}.item{padding:14px}}

<script>
window.shopStatus=function(sc,closed,known){
  var now=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
  var wd=(now.getDay()+6)%7, m=now.getHours()*60+now.getMinutes();
  function hm(x){return Math.floor(x/60)+':'+('0'+x%60).slice(-2);}
  var E=document.documentElement.lang==='en';   // 英語版（guide/en/ など）は英語で出す
  if(closed&&closed.indexOf(wd)>=0)return {s:'off',t:E?'Closed today':'今日は定休日'};
  if(!sc){return known?{s:'unknown',t:E?'Open today (see details for hours)':'今日は営業日（時間は詳細で）'}:{s:'unknown',t:E?'Days off: to be confirmed':'定休日は要確認'};}
  var r=sc.d[wd]||[];
  if(!r.length)return {s:'off',t:E?'Closed today':'今日はお休み'};
  if(r[0][0]===0&&r[0][1]===1440)return {s:'open',t:E?'Open 24 hours':'24時間'};
  for(var i=0;i<r.length;i++){
    if(m>=r[i][0]&&m<r[i][1]){var left=r[i][1]-m;return {s:'open',t:E?(left<=60?'Closing soon · until ':'Open · until ')+hm(r[i][1]):(left<=60?'まもなく閉店 ':'営業中・')+hm(r[i][1])+'まで'};}
    if(m<r[i][0])return {s:'soon',t:E?(i>0?'On a break · ':'')+'Opens '+hm(r[i][0]):(i>0?'休憩中・':'')+hm(r[i][0])+'から'};
  }
  return {s:'closed',t:E?'Closed for today (open until '+hm(r[r.length-1][1])+')':'今日は終了（'+hm(r[r.length-1][1])+'まで）'};
};
</script>

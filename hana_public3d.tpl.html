<!doctype html>
<html lang="%%LANG%%"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
%%ROBOTS%%
<meta name="color-scheme" content="light">
<link rel="icon" href="%%R%%img/brand/logo.png">
<title>%%T_TITLE%%</title>
%%ALT%%
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>/* 家守のおすすめマップ（本番・2026-11-14 作り直し）。3D の地形地図が入口で、平面と写真はボタンで切り替える。
   色はデザインシステム「三浦A邸 大漁旗」。主役は海の青。食べ物だけ暖色「柿」（ヤヌキ判断 2026-11-14）。マグロの赤は地図に置かない。
   地図の色は、三崎の日の出・日の入りの時刻から朝・昼・夕・夜に切り替える。現在地は押したときだけ、端末の中だけで使う。
   地図は MapLibre GL JS、標高は国土地理院の標高タイル、形は OpenFreeMap（OpenStreetMap）、橋・灯台・防波堤は structures.json */
:root{
  --ink:#14202B; --mute:#4F6070; --sea:#0A5A8C; --sea-press:#084a73; --sea-tint:#E6F0F6;
  --tint:#F2F6F9; --hair:#D9E1E8; --paper:#FFFFFF; --kon:#2E4C9E; --tuna:#B8243A;
  --kaki:#B4501A; --kaki-tint:#FBEDE3; --kinari:#F7F1E6;
  --draft:#FFF8E1; --draft-ink:#5A4400;
  --font:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --r:14px; --accent:var(--sea); --line:var(--hair); --soft:var(--tint); --ink-2:var(--mute);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.7 var(--font);-webkit-text-size-adjust:100%}
body.big{overflow:hidden}
.wrap{max-width:760px;margin:0 auto;padding:24px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
body.embed .hero{display:none}
body.embed .wrap{padding-top:8px}
a{color:var(--sea)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
button{font:inherit;color:inherit}

.hero{padding:0 0 4px}
.hd{display:block;width:100%;height:auto;border-radius:10px;margin:0 0 12px}
.eyebrow{display:flex;align-items:center;gap:8px;margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.16em;color:var(--sea)}
.eyebrow img{width:40px;height:40px}
h1{margin:4px 0 0;font-family:var(--mincho);font-size:clamp(26px,6.5vw,34px);line-height:1.3;font-weight:800;letter-spacing:.02em}
h1 span{display:inline-block}
.two{width:120px;height:9px;margin:14px 0 0;background:linear-gradient(var(--sea),var(--sea)) 0 0/100% 3px no-repeat,linear-gradient(var(--tuna),var(--tuna)) 0 6px/60% 3px no-repeat}
.lede{margin:10px 0 0;font-size:15px;line-height:1.8;color:var(--mute);max-width:34em}
.draft{margin:16px 0 0;padding:10px 14px;background:var(--draft);color:var(--draft-ink);border:1px solid #EBD38A;border-radius:10px;font-size:13.5px;line-height:1.6}

/* 選ぶ部品：ジャンルは segmented（1つだけ）、シーンは絞り込みの札（✓と薄い青） */
.filters{margin-top:20px;display:grid;gap:10px}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;padding:3px;background:var(--tint);border:1px solid var(--hair);border-radius:999px;max-width:100%}
.seg button{min-height:40px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--mute);font-size:14.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button small{margin-left:4px;font-size:12px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--hair)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;min-height:36px;margin:4px 0;padding:0 14px;border:1px solid var(--hair);border-radius:999px;background:#fff;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer}
.chip::after{content:"";position:absolute;inset:-4px 0}
.chip[aria-pressed=true]{background:var(--sea-tint);border-color:var(--sea);color:var(--sea)}
.chip[aria-pressed=true]::before{content:"✓ "}

/* 地図カード */
.mapcard{margin-top:16px;border:1px solid var(--hair);border-radius:var(--r);background:#fff;overflow:hidden;display:flex;flex-direction:column}
.mapwrap{position:relative}
#map{height:clamp(380px,64vh,600px);background:var(--kinari);transition:background .6s}
.mapcard.night #map{background:#1A2631}
.mapcard.big{position:fixed;inset:0;z-index:1000;margin:0;border:0;border-radius:0;padding-top:env(safe-area-inset-top,0px)}
.mapcard.big .mapwrap{flex:1;min-height:0}
.mapcard.big #map{height:100%}
.mapcard.big .mapfoot,.mapcard.big .legend{display:none}
.mapcard.big .tools{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.nogl{display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mute);font-size:14.5px}

.tools{display:grid;gap:8px;padding:10px 12px;border-top:1px solid var(--hair)}
.tools .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn2{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--sea-tint);color:var(--sea);font-size:14px;font-weight:700;cursor:pointer;transition:transform .12s,background .18s}
.btn2:active{transform:scale(.97)}
.btn2[aria-pressed=true]{background:var(--sea);color:#fff}
.btn2 svg{width:18px;height:18px;flex:none}
.tools .end{margin-left:auto}
.mapfoot{border-top:1px solid var(--hair);padding:10px 16px;font-size:12.5px;color:var(--mute);line-height:1.6}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 16px 0;font-size:12.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:inline-block}

/* 地図の上の部品 */
.pad{position:absolute;left:calc(10px + env(safe-area-inset-left,0px));bottom:30px;z-index:5;display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:2px}
.pad button{display:flex;align-items:center;justify-content:center;color:var(--ink);border:1px solid var(--hair);border-radius:10px;background:rgba(255,255,255,.94);font-size:15px;line-height:1;padding:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.pad button::after{content:"";position:absolute;inset:-2px}
.pad button:active{background:var(--sea-tint)}
.pad .u{grid-area:1/2}.pad .l{grid-area:2/1}.pad .r{grid-area:2/3}.pad .d{grid-area:3/2}
.me-btn{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:30px;z-index:5;display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 16px;border:0;border-radius:12px;background:var(--sea);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .12s}
.me-btn:active{transform:scale(.97);background:var(--sea-press)}
.me-btn svg{width:20px;height:20px}
.me-btn[aria-pressed=true]{background:#fff;color:var(--sea)}
.cap{position:absolute;left:10px;top:10px;z-index:5;max-width:calc(100% - 70px);padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.96);box-shadow:0 2px 8px rgba(0,0,0,.2);pointer-events:none;line-height:1.5;color:var(--ink)}
.cap b{display:block;font-size:15px}
.cap span{display:block;font-size:12.5px;color:var(--mute)}
#map.rot .maplibregl-canvas-container{cursor:grab}

/* ピン：地面に立つしずく形。色は食べる＝柿、買う＝海の青、暮らし＝墨 */
.pin{position:absolute;left:0;top:0;width:30px;height:37px;padding:0;border:0;background:none;cursor:pointer;font:700 14px/1 var(--font);transition:opacity .6s}
.pin::before{content:"";position:absolute;left:50%;bottom:-3px;width:16px;height:6px;margin-left:-8px;border-radius:50%;background:rgba(0,0,0,.3);filter:blur(1.5px)}
.pin i{position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:-1px 2px 4px rgba(0,0,0,.4)}
.pin span{position:absolute;left:0;top:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.pin b{display:none;position:absolute;left:100%;top:4px;margin-left:3px;max-width:10em;padding:0 8px;border-radius:99px;background:rgba(255,255,255,.96);color:var(--ink);font:700 11.5px/22px var(--font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 1px 3px rgba(0,0,0,.28)}
.pin.lab b{display:block}
.pin.home b{top:7px;color:var(--tuna)}
#map.intro .pin:not(.home){opacity:0!important;pointer-events:none}
.pin.cl{width:38px;height:46px;font-size:15px}
.pin.cl i,.pin.cl span{width:38px;height:38px}
.pin.cl i{background:#fff;border-color:var(--kaki)}
.pin.cl span{color:var(--kaki)}
.pin.cl small{font-size:10.5px;margin-left:1px;margin-top:2px}
.pin.home{width:36px;height:44px;z-index:3}
.pin.home i,.pin.home span{width:36px;height:36px}
.pin.home i{background:var(--tuna)}
.pin.home span{color:#fff}
/* 現在地：青い点と白い縁。ゆっくり脈打つ輪（動きを減らす設定では止める） */
.me{width:22px;height:22px;border-radius:50%;background:#1E7BD8;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);pointer-events:none}
.me::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(30,123,216,.55);animation:pulse 2s ease-out infinite}
@keyframes pulse{from{transform:scale(.6);opacity:1}to{transform:scale(1.5);opacity:0}}
.maplibregl-popup{max-width:min(270px,70vw)!important}
.maplibregl-popup-content{border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.18);padding:12px 30px 12px 14px;font:500 14px/1.6 var(--font);color:var(--ink)}
.maplibregl-popup-close-button{width:36px;height:36px;font-size:22px;color:var(--mute)}
.pq{color:var(--kaki);font-weight:700}
.pl{display:grid;gap:6px;margin-top:6px}
.pl button{min-height:40px;padding:4px 12px;border:1px solid var(--hair);border-radius:10px;background:#fff;text-align:left;font-size:13.5px;font-weight:700;cursor:pointer}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-group button{width:40px;height:40px}
.maplibregl-cooperative-gesture-screen{font-family:var(--font);font-size:15px;padding:16px}

/* お店リスト */
h2{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px;margin:32px 0 14px;font-family:var(--mincho);font-weight:800;font-size:20px;line-height:1.35}
h2 small{font-family:var(--font);font-size:13px;font-weight:500;color:var(--mute)}
.item{position:relative;display:block;background:#fff;border:1px solid var(--hair);border-radius:var(--r);padding:12px;margin:0 0 12px;cursor:pointer}
.item .n{position:absolute;top:20px;left:20px;z-index:1;width:34px;height:34px;border-radius:50%;font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.item>div:not(.n){padding:0 2px}
.item h3{margin:0;font-size:17.5px;line-height:1.4;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;font-weight:700;color:var(--mute);background:var(--tint);border-radius:99px;padding:0 10px;line-height:22px}
.tag.chk{color:var(--draft-ink);background:#FFF3C4}
.dist{display:inline-block;margin:4px 0 0;font-size:13px;font-weight:700;color:var(--sea)}
.hearts{margin:8px 0 0;font-size:17px;letter-spacing:1px;line-height:1.2}
.quote{margin:10px 0 0;padding:9px 12px;background:var(--kaki-tint);border-left:3px solid var(--kaki);border-radius:4px 10px 10px 4px;font-size:14.5px;line-height:1.7}
.quote b{display:block;font-size:11.5px;letter-spacing:.08em;color:var(--kaki);margin-bottom:2px}
.note{margin:10px 0 0;font-size:14.5px;line-height:1.75}
.meta{margin:6px 0 0;font-size:13px;line-height:1.6;color:var(--mute)}
.ph{display:block;width:100%;max-width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;margin:0 0 8px;background:var(--kaki-tint)}
.noph{display:flex;align-items:center;justify-content:center;color:var(--kaki);font-size:12px;font-weight:700;letter-spacing:.1em}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 0}
.acts a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:12px;background:var(--sea-tint);color:var(--sea);font-weight:700;font-size:14px;text-decoration:none}
.item .ost{margin:4px 8px 0 0}
%%STATUSCSS%%
.empty{padding:28px 16px;text-align:center;color:var(--mute);background:var(--tint);border-radius:var(--r)}
.foot{margin-top:24px;font-size:12.5px;color:var(--mute);line-height:1.7}
%%LANGCSS%%
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.me::after{animation:none;opacity:.5}.btn2,.me-btn{transition:none}}
@media (min-width:720px){.wrap{padding-top:40px}.item{padding:14px}}
</style></head><body>
<div class="wrap">

<header class="hero">
  %%LANGSWITCH%%
  <img class="hd" src="%%R%%img/brand/header-maguro.jpg" alt="" width="1500" height="500">

  <h1>%%T_H1%%</h1>

<div class="filters">

      <button type="button" class="r" data-b="20"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:scaleX(-1)"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg></button>

  </div>

      <button type="button" class="btn2" id="ttr" aria-pressed="false"></button>

<h2 id="lh">%%T_LIST%% <small id="lc"></small></h2>

%%OPENJS%%
<script>
(function(){
var D=%%DATA%%, ST=%%STRUCT%%, HOME=%%HOME%%, KEEPER="%%KEEPER%%", EXAG=%%EXAG%%;
var CATS=%%T_CATS%%, T=%%T_JS%%;
var COL={"食べる":"#B4501A","買う":"#0A5A8C","困ったとき":"#4F6070"};
var st={cat:"all",sc:""};
function $(s){return document.querySelector(s)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hs(n,m){m=m||5;var o="";for(var i=1;i<=m;i++)o+=i<=n?"❤️":"♡";return o}
function fmt(s,n){return s.replace("{n}",n)}
if(/[?&]embed=1/.test(location.search))document.body.classList.add("embed");
var calm=window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches;
var fine=window.matchMedia&&matchMedia("(pointer:fine)").matches;

/* ---------- 時刻の色：三崎（35.14N, 139.62E）の日の出・日の入りを、日本時間で計算する（NOAA の近似式。±数分） ---------- */
var LAT=35.14,LON=139.62;
function sun(now){
  var j=new Date(now.getTime()+9*3600e3),y0=Date.UTC(j.getUTCFullYear(),0,1),n=Math.floor((j-y0)/864e5)+1,g=2*Math.PI/365*(n-1),r=Math.PI/180;
  var eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  var de=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  var ha=Math.acos(Math.cos(90.833*r)/(Math.cos(LAT*r)*Math.cos(de))-Math.tan(LAT*r)*Math.tan(de))/r;
  return {rise:720-4*(LON+ha)-eq+540,set:720-4*(LON-ha)-eq+540,m:j.getUTCHours()*60+j.getUTCMinutes()}}
function phaseNow(){var s=sun(new Date());
  if(s.m<s.rise-40||s.m>=s.set+40)return "night";
  if(s.m<s.rise+120)return "morning";
  if(s.m<s.set-60)return "day";
  return "evening"}
/* 地図の絵柄の色。昼が基本（生成りの地・海の青・白い建物）。夜は「夜の港」の紺で、建物の一部に明かり */
var PAL={
  morning:{land:"#F6EFE8",farm:"#EFE6D6",grass:"#DFE6D0",wood:"#CCD9BC",sand:"#F3E4CC",rock:"#E7DDD3",water:"#9CC3DA",road:"#FFFFFF",roadCase:"#E8DACB",path:"#DACDBC",bld:"#FFF8F1",text:"#5A4E42",seaText:"#1F5F8B",halo:"rgba(255,255,255,.85)",
    sky:{"sky-color":"#BFD6E6","horizon-color":"#F6D9C6","fog-color":"#F6E7DC"},sh:["#5d6a62","#ffffff","#76817a"],stOp:.95},
  day:{land:"#F7F1E6",farm:"#F0E9D4",grass:"#E2E6CC",wood:"#CFDAB8",sand:"#F2E5C6",rock:"#E6DED0",water:"#8CB8D2",road:"#FFFFFF",roadCase:"#E6D9C6",path:"#D9CCB6",bld:"#FFFBF4",text:"#5A4E42",seaText:"#1F5F8B",halo:"rgba(255,255,255,.85)",

      if(bm){x.drawImage(bm,0,0);im=x.getImageData(0,0,256,256)}else im=x.createImageData(256,256);

    for(var i=0;i<used.length;i++){var u=used[i];if(r[0]<u[2]&&r[2]>u[0]&&r[1]<u[3]&&r[3]>u[1]){hit=true;break}}
    if(hit)k.el.classList.remove("lab");else used.push(r)});
}
function fit(first,anim){

  map.fitBounds(b,{padding:{top:70,bottom:90,left:50,right:50},maxZoom:16.5,bearing:first?0:map.getBearing(),pitch:first?(flat?0:55):map.getPitch(),duration:((first&&!anim)||calm)?0:700});
}

function chips(){

  CATS.forEach(function(x){var n=x[0]==="all"?D.length:D.filter(function(d){return d.cat===x[0]}).length;if(x[0]!=="all"&&!n)return;
    var b=document.createElement("button");b.type="button";b.setAttribute("aria-pressed",st.cat===x[0]);b.innerHTML=esc(x[1])+'<small>'+n+'</small>';
    b.onclick=function(){st.cat=x[0];chips();render()};c.appendChild(b)});
  var sc=[];D.forEach(function(d){(d.w||[]).forEach(function(w){if(sc.indexOf(w)<0)sc.push(w)})});
  var s=$("#scs");s.innerHTML="";s.hidden=!sc.length;
  sc.forEach(function(w){var b=document.createElement("button");b.type="button";b.className="chip";b.setAttribute("aria-pressed",st.sc===w);b.textContent=w;
    b.onclick=function(){st.sc=(st.sc===w?"":w);chips();render()};s.appendChild(b)});

if(map){

  /* 時刻の色：自動 → 朝 → 昼 → 夕 → 夜 → 自動 */
  $("#ttod").onclick=function(){var o=["auto","morning","day","evening","night"];tod=o[(o.indexOf(tod)+1)%o.length];try{localStorage.setItem("hanaTod",tod)}catch(e){}applyPal()};
  setInterval(function(){if(tod==="auto"&&phaseNow()!==phase)applyPal()},5*60e3);
  $("#tme").onclick=function(){if(watch!==null)meOff();else meOn()};
  function nudge(b){var o={duration:250,easing:function(t){return t}};

    ["pointerup","pointerleave","pointercancel"].forEach(function(k){b.addEventListener(k,stop)});
    b.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();nudge(b)}});
    b.addEventListener("contextmenu",function(e){e.preventDefault()})});
  /* 「ドラッグで回す」：マウスのときだけ出す（スマホは指2本で回せる） */
  var rot=false,dr=null,cc=map.getCanvasContainer();

  function syncRot(){$("#map").classList.toggle("rot",rot);if(rot)map.dragPan.disable();else map.dragPan.enable()}
  $("#tdr").onclick=function(){rot=this.getAttribute("aria-pressed")!=="true";this.setAttribute("aria-pressed",rot);syncRot()};
  cc.addEventListener("pointerdown",function(e){
    if(!rot||e.button!==0||e.ctrlKey||e.pointerType==="touch"||!e.isPrimary)return;
    if(e.target.closest&&e.target.closest(".pin,.maplibregl-popup"))return;
    dr={x:e.clientX,y:e.clientY,b:map.getBearing(),p:map.getPitch(),id:e.pointerId};map.stop();try{cc.setPointerCapture(e.pointerId)}catch(_){}});
  cc.addEventListener("pointermove",function(e){if(!dr||e.pointerId!==dr.id)return;
    map.jumpTo({bearing:dr.b+(e.clientX-dr.x)*.5,pitch:Math.max(0,Math.min(75,dr.p-(e.clientY-dr.y)*.4))})});
  ["pointerup","pointercancel"].forEach(function(k){cc.addEventListener(k,function(e){if(dr&&e.pointerId===dr.id)dr=null})});
  if(HOME)$("#thm").onclick=function(){go({center:[HOME.lon,HOME.lat],zoom:16.5,bearing:0,pitch:flat?0:55,duration:900});homePop()};
  else $("#thm").onclick=function(){shut();fit(true,true)};
  $("#tbg").onclick=function(){var on=this.getAttribute("aria-pressed")!=="true";this.setAttribute("aria-pressed",on);this.textContent=on?T.close:T.big;

  if(HOME)TOUR.unshift({n:HOME.name,t:T.tourStart,c:[HOME.lon,HOME.lat],z:17.2,b:-20,p:60});
  var tq=[];

  function tstep(i){
    if(i>=TOUR.length){tstop();fit(true,true);return}

    if(calm){map.jumpTo(o);tq.push(setTimeout(function(){tstep(i+1)},4500));return}
    map.flyTo(Object.assign({duration:3800,essential:true},o));
    tq.push(setTimeout(function(){map.easeTo({bearing:s.b+35,duration:4000,easing:function(t){return t}})},3900));
    tq.push(setTimeout(function(){tstep(i+1)},8000))}
  $("#ttr").onclick=function(){if(ti>=0){tstop();return}this.setAttribute("aria-pressed",true);this.textContent=T.tourStop;tstep(0)};

  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("#card").classList.contains("big"))$("#tbg").click()});
}
